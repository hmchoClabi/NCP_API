exclude: '(^|/)(deploy/private|secrets|\.venv|\.tmp|output|reports)/|(^|/)\.env[^/]*$'

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check
        language: system
        types_or: [python, pyi]
      - id: check-yaml
        name: check yaml
        entry: python -m pre_commit_hooks.check_yaml
        args: [--allow-multiple-documents]
        language: system
        types: [yaml]
        exclude: '^deploy/helm/[^/]+/templates/'
      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private key
        entry: python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]
