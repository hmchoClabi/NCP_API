[project]
name = "ncp-report"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: PostgreSQL required; REPORT_DB_INTEGRATION_TEST=1",
    "worker_integration: worker-role PostgreSQL required; REPORT_DB_WORKER_INTEGRATION_TEST=1",
    "js: Node.js required",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["deploy/private", "secrets", ".env*", "output", "reports", ".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["app", "collectors", "normalizers", "ncp_api", "webapp", "database", "utils", "config"]
