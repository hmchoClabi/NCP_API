{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ncp-report.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ncp-report.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    alb.ingress.kubernetes.io/listen-ports: {{ ternary "[{\"HTTP\": 80}, {\"HTTPS\": 443}]" "[{\"HTTP\": 80}]" (ne .Values.ingress.certificateNo "") | quote }}
    alb.ingress.kubernetes.io/network-type: {{ .Values.ingress.networkType | quote }}
    alb.ingress.kubernetes.io/load-balancer-size: {{ .Values.ingress.loadBalancerSize | quote }}
    alb.ingress.kubernetes.io/idle-timeout: {{ .Values.ingress.idleTimeout | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath | quote }}
    {{- with .Values.ingress.loadBalancerName }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.subnetId }}
    alb.ingress.kubernetes.io/subnet-id: {{ . | quote }}
    {{- end }}
    {{- if .Values.ingress.certificateNo }}
    alb.ingress.kubernetes.io/ssl-certificate-no: {{ .Values.ingress.certificateNo | quote }}
    alb.ingress.kubernetes.io/ssl-min-version: TLSV12
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    {{- with .Values.ingress.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ncp-report.fullname" . }}-web
                port:
                  number: {{ .Values.service.port }}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
