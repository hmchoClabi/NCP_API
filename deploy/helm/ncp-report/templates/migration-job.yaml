apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ncp-report.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ncp-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ncp-report.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- include "ncp-report.imagePullSecrets" . | nindent 6 }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: PGHOST
              value: {{ include "ncp-report.databaseHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_ADMIN_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_ADMIN_PASSWORD
            - name: PGSSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: DB_CONTROL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_CONTROL_APP_PASSWORD
            - name: DB_PUBLIC_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_PUBLIC_WORKER_PASSWORD
            - name: DB_GOV_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_GOV_WORKER_PASSWORD
            - name: DB_MSP_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB_MSP_APP_PASSWORD
            - name: DB_WAIT_SECONDS
              value: {{ .Values.migration.waitSeconds | quote }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
