{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  annotations:
    helm.sh/resource-policy: keep
provisioner: {{ .Values.storageClass.provisioner }}
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: {{ .Values.storageClass.type }}
  csi.storage.k8s.io/fstype: ext4
---
{{- end }}
{{- if .Values.artifacts.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ncp-report.fullname" . }}-artifacts
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ncp-report.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass.name }}
  resources:
    requests:
      storage: {{ .Values.artifacts.persistence.storageSize }}
---
{{- end }}
{{- if and .Values.backups.enabled .Values.backups.createClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ncp-report.fullname" . }}-backups
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ncp-report.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass.name }}
  resources:
    requests:
      storage: {{ .Values.backups.storageSize }}
{{- end }}
