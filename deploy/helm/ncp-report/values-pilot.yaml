fullnameOverride: ncp-report

image:
  # SourceBuild pushes internally; NKS pulls through the VPC private endpoint.
  repository: qoyw4pih.kr.private-ncr.ntruss.com/ncp-report
  tag: pilot-20260805-002
  pullPolicy: IfNotPresent
  pullSecrets:
    - ncp-registry

migration:
  enabled: false
  image:
    repository: qoyw4pih.kr.private-ncr.ntruss.com/ncp-report-migrate
    tag: pilot-20260805-002

service:
  # NKS ALB Ingress requires a NodePort backend service.
  type: NodePort

web:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  host: ""
  certificateNo: ""
  networkType: public
  loadBalancerSize: small
  loadBalancerName: architect-report-alb
  subnetId: "315758"
  healthcheckPath: /health/ready

storageClass:
  create: true
  name: ncp-report-retain
  provisioner: blk.csi.ncloud.com
  type: CB1

postgresql:
  enabled: true
  storageSize: 20Gi

artifacts:
  persistence:
    enabled: true
    # NKS KVM Block Storage minimum; sufficient for the one-node pilot.
    storageSize: 10Gi

backups:
  enabled: true
  # 03:00 KST. Kubernetes CronJob schedules are UTC unless timeZone is set.
  schedule: "0 18 * * *"
  retentionDays: 7
  storageSize: 10Gi
