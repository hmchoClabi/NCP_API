apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ncp-report-web
  namespace: ncp-report
  labels:
    app.kubernetes.io/name: ncp-report
    app.kubernetes.io/instance: ncp-report
    app.kubernetes.io/managed-by: SourceDeploy
    helm.sh/chart: "ncp-report-0.1.0"
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ncp-report-web
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
